name: Intraday tracker

on:
  schedule:
    # Every 15 minutes from 09:15 to 15:45 IST (03:45 to 10:15 UTC), Monday to Friday.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: ignore
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check stops and targets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m swing.tracker
      - name: Save state
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Tracker update $(date -u +%FT%H:%M)"
          git pull --rebase origin main
          git push
